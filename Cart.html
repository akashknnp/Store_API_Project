<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./Cart.css" />
  </head>
  <body>
    <div class="navigation">
      <div class="nav-logo">
        <h4>Ecommerce</h4>
      </div>

      <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./Products.html">Products</a>
        <a href="./About.html">About</a>
        <a href="./Contact.html">Contact</a>
      </div>

      <div class="nav-icons">
        <a href="./Login.html"
          ><i class="fa-solid fa-arrow-right-to-bracket"></i
          ><span>Login</span></a
        >
        <a href="./Register.html"
          ><i class="fa-solid fa-user-plus"></i><span>Register</span></a
        >
        <a href="./Cart.html"
          ><i class="fa-solid fa-cart-shopping"></i><span>Cart</span></a
        >
      </div>
    </div>

    <div class="Cart-heading">
      <h1>Cart</h1>
    </div>

    <div class="cart-parent">
      <div class="cart-items">
        <p>No Items Added Yet...</p>
      </div>
      <div class="cart-summary">
        <div class="order-summary">
          <h3>Order Summary</h3>
          <div>
            <p>Products (<span id="total-items">0</span>)</p>
            <span id="product-total">$0</span>
          </div>
          <div>
            <p>Shipping</p>
            <span id="shipping">$30</span>
          </div>
          <div>
            <p><b>Total amount</b></p>
            <b><span id="grand-total">$0</span></b>
          </div>

          <button class="checkout-btn">Go to checkout</button>
        </div>
      </div>
    </div>

    <script src="./Cart.js"></script>
  </body>
</html>
